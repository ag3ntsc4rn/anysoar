[project]
name = "anysoar"
version = "0.6.0"
description = "Vendor-agnostic adapter that lets AI agents operate any SOAR platform through one interface."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "ag3ntsc4rn" }]
keywords = ["soar", "security-automation", "mcp", "ai-agents", "ocsf", "soc"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = ["pydantic>=2.14,<3"]

[project.scripts]
anysoar-mcp = "anysoar.mcp.cli:main"

[project.optional-dependencies]
mcp = ["mcp>=2.3"]
shuffle = ["httpx2>=2.13,<3"]
tines = ["httpx2>=2.13,<3"]
thehive = ["httpx2>=2.13,<3"]
testing = ["pytest>=9.1", "pytest-asyncio>=1.4"]

[project.urls]
Homepage = "https://github.com/ag3ntsc4rn/anysoar"
Repository = "https://github.com/ag3ntsc4rn/anysoar"
Issues = "https://github.com/ag3ntsc4rn/anysoar/issues"
Changelog = "https://github.com/ag3ntsc4rn/anysoar/blob/main/CHANGELOG.md"

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"
