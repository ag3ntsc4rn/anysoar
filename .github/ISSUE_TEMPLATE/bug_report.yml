name: Bug report
description: Something isn't working as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities must be reported privately, not here. See SECURITY.md.
        Please use only synthetic data in examples: no real alerts, indicators or credentials.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code sample or sequence of steps.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: anysoar version
      placeholder: "0.0.1"
    validations:
      required: true
  - type: input
    id: driver
    attributes:
      label: Driver and SOAR version
      placeholder: "shuffle driver, Shuffle 2.x"
  - type: input
    id: environment
    attributes:
      label: Python version and OS
      placeholder: "Python 3.12, macOS 26"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or tracebacks
      render: text
